name: Plugin release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Validate PHP syntax
        run: |
          php -l plugin/src/engine.php
          php -l plugin/src/network.php
          php -l plugin/webui/powerpilot.page
      - name: Test decision engine
        run: php plugin/tests/engine_test.php
      - name: Test network tuning
        run: php plugin/tests/network_test.php
      - name: Build Unraid package
        run: |
          TAG_VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          VERSION="$(cat plugin/VERSION)"
          test "$TAG_VERSION" = "$VERSION"
          bash plugin/build-release.sh "$VERSION"
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/powerpilot.plg
            dist/powerpilot-*.txz