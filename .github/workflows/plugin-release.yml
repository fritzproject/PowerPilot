name: Plugin release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP and run tests
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work php:8.3-cli sh -lc '
            set -e
            php -l plugin/src/engine.php
            php -l plugin/src/network.php
            php -l plugin/webui/powerpilot.page
            php plugin/tests/engine_test.php
            php plugin/tests/network_test.php
          '
      - name: Build Unraid package
        run: |
          TAG_VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          VERSION="$(cat plugin/VERSION)"
          test "$TAG_VERSION" = "$VERSION"
          bash plugin/build-release.sh "$VERSION"
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/powerpilot.plg
            dist/powerpilot-*.txz
