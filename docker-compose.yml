services:
  dynamic-power-manager:
    build: .
    container_name: dynamic-power-manager
    restart: unless-stopped
    privileged: true
    pid: host
    ports:
      - "8787:8787"
    volumes:
      - /mnt/user/appdata/dynamic-power-manager:/data
      - /sys:/sys:rw
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Rome
      DPM_DATA_DIR: /data
